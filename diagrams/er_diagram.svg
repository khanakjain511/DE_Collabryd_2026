<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#f8fafc"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.entity{fill:#fff;stroke:#286090;stroke-width:2;rx:12}.head{fill:#e8f1fb;stroke:#286090;stroke-width:2;rx:12}.name{font-size:17px;font-weight:700}.attr{font-size:12px}.rel{stroke:#61758a;stroke-width:2;fill:none}.card{font-size:12px;font-weight:600;fill:#40566b}</style>
<text x="40" y="42" class="title">Uber Ride-Hailing Data Model</text>
<g><rect x="55" y="90" width="220" height="150" class="entity"/><path d="M55 132h220" class="rel"/><text x="72" y="117" class="name">cities</text><text x="72" y="155" class="attr">PK city_id</text><text x="72" y="175" class="attr">UQ city_name, state</text><text x="72" y="195" class="attr">fare rates, launched_on</text></g>
<g><rect x="55" y="320" width="220" height="150" class="entity"/><path d="M55 362h220" class="rel"/><text x="72" y="347" class="name">riders</text><text x="72" y="385" class="attr">PK rider_id</text><text x="72" y="405" class="attr">UQ email, phone</text><text x="72" y="425" class="attr">FK home_city_id</text><text x="72" y="445" class="attr">profile, rating snapshot</text></g>
<g><rect x="355" y="90" width="220" height="150" class="entity"/><path d="M355 132h220" class="rel"/><text x="372" y="117" class="name">drivers</text><text x="372" y="155" class="attr">PK driver_id</text><text x="372" y="175" class="attr">UQ phone, license_no</text><text x="372" y="195" class="attr">FK city_id, status</text><text x="372" y="215" class="attr">driver_rating</text></g>
<g><rect x="355" y="320" width="220" height="150" class="entity"/><path d="M355 362h220" class="rel"/><text x="372" y="347" class="name">vehicles</text><text x="372" y="385" class="attr">PK vehicle_id</text><text x="372" y="405" class="attr">UQ registration_no</text><text x="372" y="425" class="attr">FK driver_id</text><text x="372" y="445" class="attr">type, capacity, make/model</text></g>
<g><rect x="675" y="245" width="275" height="230" class="entity"/><path d="M675 287h275" class="rel"/><text x="692" y="272" class="name">trips</text><text x="692" y="310" class="attr">PK trip_id</text><text x="692" y="330" class="attr">FK rider, driver, vehicle, city</text><text x="692" y="350" class="attr">FK optional promo_code</text><text x="692" y="370" class="attr">timestamps and coordinates</text><text x="692" y="390" class="attr">distance, duration, surge, fare</text><text x="692" y="410" class="attr">status and lifecycle checks</text></g>
<g><rect x="55" y="560" width="220" height="130" class="entity"/><path d="M55 602h220" class="rel"/><text x="72" y="587" class="name">promo_codes</text><text x="72" y="625" class="attr">PK promo_code</text><text x="72" y="645" class="attr">discount, validity dates</text><text x="72" y="665" class="attr">active flag</text></g>
<g><rect x="985" y="130" width="180" height="130" class="entity"/><path d="M985 172h180" class="rel"/><text x="1002" y="157" class="name">payments</text><text x="1002" y="195" class="attr">PK payment_id</text><text x="1002" y="215" class="attr">UQ/FK trip_id</text><text x="1002" y="235" class="attr">amount, method, status</text></g>
<g><rect x="985" y="390" width="180" height="130" class="entity"/><path d="M985 432h180" class="rel"/><text x="1002" y="417" class="name">ratings</text><text x="1002" y="455" class="attr">PK/FK trip_id + rated_by</text><text x="1002" y="475" class="attr">stars, comment</text><text x="1002" y="495" class="attr">created_at</text></g>
<path d="M275 150h80M165 240v80M275 395h80M575 165 C625 165 620 300 675 300M575 395h100M275 395 C500 550 625 500 675 450M275 625 C510 625 600 530 700 475M950 300 C1000 285 1000 250 1020 250M950 420h35" class="rel"/>
<text x="300" y="140" class="card">1 : N</text><text x="175" y="285" class="card">1 : N</text><text x="300" y="385" class="card">1 : N</text><text x="610" y="205" class="card">1 : N</text><text x="610" y="385" class="card">1 : N</text><text x="960" y="285" class="card">1 : 0..1</text><text x="960" y="412" class="card">1 : N</text>
</svg>
